name: Reconcile Radar news cleanup

on:
  push:
    branches:
      - fix/rss-news-contamination-20260903

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rss-news-contamination-20260903
          fetch-depth: 0
      - name: Apply production patch
        run: |
          curl -fsSL https://radar.tukutuku.org/radar-news-cleanup.patch -o /tmp/radar-news-cleanup.patch
          echo "ce4d0fd4f9c54e7d9004fb4eb46ce91f6c90b850f986e3aec4a67e7dbbd0c7e6  /tmp/radar-news-cleanup.patch" | sha256sum -c -
          git apply --check /tmp/radar-news-cleanup.patch
          git apply /tmp/radar-news-cleanup.patch
          rm .github/workflows/reconcile-news-cleanup.yml
      - name: Commit reconciled source
        run: |
          git config user.name "radar-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scrapers/scanProfiles.ts scrapers/scraperManager.ts scrapers/RssFeedScraper.ts scrapers/applicationResolver.ts .github/workflows/reconcile-news-cleanup.yml
          git commit -m "Filter editorial RSS sources from Discovery"
          git push origin HEAD:fix/rss-news-contamination-20260903
