name: Apply validated Radar source expansion

on:
  push:
    branches:
      - source-expansion-funding-jobs-fellowships

permissions:
  contents: write

jobs:
  apply-validated-tree:
    if: github.event.head_commit.message == 'chore: trigger validated source expansion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://radar.tukutuku.org/source-expansion-b0a6faa80eb74b6a.patch' -o /tmp/radar-source.patch
          echo 'b0a6faa80eb74b6abd1102c48bab7b57ec14602f5fa13fd181d7a05dddb570b2  /tmp/radar-source.patch' | sha256sum -c -
          git apply --index /tmp/radar-source.patch
          rm .github/workflows/source-expansion-apply.yml
          git add -A
          tree="$(git write-tree)"
          echo "Validated tree: $tree"
          test "$tree" = '3128927f66f37c05c0eb89b1500fe97da76146c7'
          git config user.name 'Tuku Source Expansion'
          git config user.email 'source-expansion@tukutuku.org'
          git commit -m 'feat: expand Radar funding jobs and fellowship sources'
          git push origin HEAD:source-expansion-funding-jobs-fellowships
