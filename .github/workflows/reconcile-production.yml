name: Reconcile Radar production

on:
  push:
    branches:
      - reconcile/radar-production-20260903

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/radar-production-20260903
          fetch-depth: 0

      - name: Apply verified production patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://radar.tukutuku.org/reconcile-e03e41af83cb.patch -o /tmp/radar-production.patch
          echo "e03e41af83cbc1c7b434433d9c2e0fcfb14a19a43df627883de9cf34c6d2da9b  /tmp/radar-production.patch" | sha256sum -c -
          git apply --index /tmp/radar-production.patch
          rm .github/workflows/reconcile-production.yml
          git add -A
          git config user.name "Radar Production Reconciler"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Reconcile Radar production intelligence and application routing"
          git push origin HEAD:reconcile/radar-production-20260903
